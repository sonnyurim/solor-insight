services:
  db:
    image: postgres:15-alpine
    container_name: solor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-solar_insight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-solar_insight}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solor-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-solar_insight}?schema=public
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_REGION_SEOUL: ${AWS_REGION_SEOUL:-ap-northeast-2}
      DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY}
      KMA_API_KEY: ${KMA_API_KEY}
      KNOWLEDGE_BASE_ID: ${KNOWLEDGE_BASE_ID}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-24}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT:-50}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: solor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  postgres_data:
